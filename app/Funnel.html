<script>
/* Funnel de envíos a comité. Las condiciones salen de las hojas de Tableau; aquí solo se cuentan. */
function uno(c, i, k) {
  return c[k] && c[k][i] === "1";
}
function filasFunnel() {
  const t = window.TABLAS && window.TABLAS.funnel;
  if (!t) return null;
  const f = filtros();
  const nid = (val("funnel-nid") || "").trim();
  const c = t.cols;
  const idx = [];
  for (let i = 0; i < t.n; i++) {
    if (f.pais && c.pais[i] !== f.pais) continue;
    if (!enRango(c.envio[i], f.envioDesde, f.envioHasta)) continue;
    if (f.equipo && !f.equipo.has(c.equipo[i])) continue;
    if (f.propietario && !f.propietario.has(c.propietario[i])) continue;
    if (f.dueno && !f.dueno.has(c.dueno[i])) continue;
    if (nid && String(c.nid[i]).indexOf(nid) < 0) continue;
    idx.push(i);
  }
  return { t: t, idx: idx };
}
function contarFunnel(t, idx) {
  const c = t.cols;
  const n = {
    llego: 0,
    doc: 0, docOk: 0, docCurso: 0, docRecha: 0, docNo: 0,
    checks: 0, checksOk: 0, checksCurso: 0, checksNo: 0,
    pricing: 0, pricingOk: 0, pricingCurso: 0, pricingRecha: 0, pricingSin: 0,
    remo: 0, remoOk: 0, remoCurso: 0, remoRecha: 0, finalizo: 0,
    hesh: 0, heshOk: 0, heshCurso: 0, heshNo: 0,
    armado: 0, armadoOk: 0, armadoCurso: 0, armadoRecha: 0, armadoSin: 0,
    aprob: 0, aprobOk: 0, aprobCurso: 0, aprobRecha: 0, aprobSin: 0,
  };
  idx.forEach(i => {
    const orq = uno(c, i, "orq");
    const revDoc = uno(c, i, "rev_doc");
    const docOk = uno(c, i, "doc_ok");
    const revChecks = uno(c, i, "rev_checks");
    const checksOk = uno(c, i, "checks_ok");
    const revPricing = uno(c, i, "rev_pricing");
    const pricingOk = uno(c, i, "pricing_ok");
    const revRemo = uno(c, i, "rev_remo");
    const remoOk = uno(c, i, "remo_ok");
    const revHesh = uno(c, i, "rev_hesh");
    const heshOk = uno(c, i, "hesh_ok");
    const revArmado = uno(c, i, "rev_armado");
    const revAprob = uno(c, i, "rev_aprob");
    if (orq) n.llego++;
    if (revDoc) n.doc++;
    if (revDoc && docOk) n.docOk++;
    if (revDoc && uno(c, i, "doc_curso")) n.docCurso++;
    if (revDoc && uno(c, i, "doc_recha")) n.docRecha++;
    if (!revDoc && orq) n.docNo++;
    if (revDoc && revChecks && docOk) n.checks++;
    if (revDoc && revChecks && docOk && checksOk) n.checksOk++;
    if (revDoc && revChecks && docOk && uno(c, i, "checks_curso")) n.checksCurso++;
    if (revDoc && !revChecks && docOk) n.checksNo++;
    if (revDoc && revPricing && docOk) n.pricing++;
    if (revDoc && revPricing && docOk && pricingOk) n.pricingOk++;
    if (revDoc && revPricing && docOk && !pricingOk && uno(c, i, "pricing_curso")) n.pricingCurso++;
    if (revDoc && revPricing && docOk && uno(c, i, "pricing_recha")) n.pricingRecha++;
    if (revDoc && !revPricing && checksOk && docOk) n.pricingSin++;
    if (revDoc && revRemo && docOk) n.remo++;
    if (revDoc && revRemo && docOk && remoOk) n.remoOk++;
    if (revDoc && revRemo && docOk && uno(c, i, "remo_curso")) n.remoCurso++;
    if (revDoc && revRemo && docOk && uno(c, i, "remo_recha")) n.remoRecha++;
    if (revDoc && docOk && pricingOk && remoOk) n.finalizo++;
    if (revDoc && revHesh && docOk) n.hesh++;
    if (revDoc && docOk && heshOk) n.heshOk++;
    if (revDoc && revHesh && docOk && uno(c, i, "hesh_curso")) n.heshCurso++;
    if (revDoc && !revHesh && docOk) n.heshNo++;
    if (revArmado && docOk && heshOk) n.armado++;
    if (revArmado && docOk && heshOk && uno(c, i, "armado_ok")) n.armadoOk++;
    if (revArmado && docOk && heshOk && uno(c, i, "armado_curso")) n.armadoCurso++;
    if (revArmado && docOk && heshOk && uno(c, i, "armado_recha")) n.armadoRecha++;
    if (!revArmado && docOk && heshOk) n.armadoSin++;
    if (revAprob && docOk && heshOk) n.aprob++;
    if (docOk && heshOk && uno(c, i, "aprob_ok")) n.aprobOk++;
    if (docOk && heshOk && uno(c, i, "aprob_curso")) n.aprobCurso++;
    if (docOk && heshOk && uno(c, i, "aprob_recha")) n.aprobRecha++;
    if (!revAprob && docOk && heshOk) n.aprobSin++;
  });
  n.envios = idx.length;
  n.noLlego = n.envios - n.llego;
  return n;
}
function pctTxt(parte, base) {
  if (!base) return "—";
  return nf1.format((100 * parte) / base) + "%";
}
function anchoEmbudo(valor, base) {
  if (!base) return 42;
  return Math.max(42, Math.min(100, Math.round((100 * valor) / base)));
}
function pastillas(items) {
  const vivas = items.filter(x => x.valor);
  if (!vivas.length) return "";
  return `<div class="embudo-pastillas">${vivas.map(x =>
    `<span class="embudo-pill ${x.tono || ""}">${esc(x.nombre)}<b>${nf.format(x.valor)}</b> ${pctTxt(x.valor, x.base)}</span>`
  ).join("")}</div>`;
}
function barraEmbudo(titulo, valor, detalle, ancho) {
  return `<div class="embudo-riel"><div class="embudo-barra" style="width:${ancho}%"><b>${esc(titulo)}</b><strong>${nf.format(valor)}</strong><small>${esc(detalle)}</small></div></div>`;
}
function pasoEmbudo(titulo, valor, detalle, ancho, items) {
  return `<div>${barraEmbudo(titulo, valor, detalle, ancho)}${pastillas(items)}</div>`;
}
function pintarFunnel() {
  const v = VISTAS.find(x => x.id === "funnel");
  document.getElementById("titulo").textContent = v.nombre;
  document.getElementById("subtitulo").textContent = v.nota;
  const detalle = document.getElementById("detalle");
  detalle.hidden = true;
  detalle.innerHTML = "";
  detalleArmada = "";
  const pagina = document.getElementById("pagina");
  const pack = filasFunnel();
  if (!pack) {
    const extra = window.ERROR_FUNNEL ? ` ${esc(window.ERROR_FUNNEL)}` : " Si acabas de publicar, vuelve a esta pestaña en un minuto.";
    pagina.innerHTML = `<p class="aviso-espera">El funnel se está preparando con la lectura del día. Las pestañas de SLA siguen disponibles.${extra}</p>`;
    return;
  }
  const n = contarFunnel(pack.t, pack.idx);
  const pais = radio("funnel-pais");
  const donde = pais ? rotuloPais(pais) : "Todos los países";
  const base = Math.max(n.llego, 1);
  const siguen = (valor, de) => `${nf.format(de)} entran · ${pctTxt(valor, de)} siguen`;
  pagina.innerHTML = `
    <div class="embudo-cabeza">
      <div>
        <p>Envíos a comité</p>
        <strong>${nf.format(n.envios)}</strong>
      </div>
      <p>${esc(donde)}</p>
    </div>
    <div class="embudo-abre" style="grid-template-columns: minmax(160px, ${Math.max(n.noLlego, 1)}fr) minmax(280px, ${Math.max(n.llego, 1)}fr)">
      <aside class="embudo-queda">
        <span>Se detienen</span>
        <strong>${nf.format(n.noLlego)}</strong>
        <small>No llegaron al orquestador · ${pctTxt(n.noLlego, n.envios)} de los envíos. Este lado no sigue.</small>
      </aside>
      <div class="embudo-camino">
        <p class="embudo-kicker">Siguen</p>
        ${pasoEmbudo("Recibidos por el orquestador", n.llego, pctTxt(n.llego, n.envios) + " de los envíos", 100, [])}
        ${pasoEmbudo("Revisión de documentos", n.docOk, siguen(n.docOk, n.doc), anchoEmbudo(n.docOk, base), [
          { nombre: "No inició", valor: n.docNo, base: n.llego, tono: "" },
          { nombre: "En curso", valor: n.docCurso, base: n.doc, tono: "curso" },
          { nombre: "Rechazado", valor: n.docRecha, base: n.doc, tono: "recha" },
        ])}
        <div class="embudo-par">
          <div>
            ${pasoEmbudo("Checks", n.checksOk, siguen(n.checksOk, n.checks), 100, [
              { nombre: "En curso", valor: n.checksCurso, base: n.checks, tono: "curso" },
              { nombre: "Sin tarea", valor: n.checksNo, base: n.docOk, tono: "" },
            ])}
          </div>
          <div>
            ${pasoEmbudo("Remodelación", n.remoOk, siguen(n.remoOk, n.remo), 100, [
              { nombre: "En curso", valor: n.remoCurso, base: n.remo, tono: "curso" },
              { nombre: "Rechazado", valor: n.remoRecha, base: n.remo, tono: "recha" },
            ])}
          </div>
        </div>
        ${pasoEmbudo("Pricing", n.pricingOk, siguen(n.pricingOk, n.pricing), anchoEmbudo(n.pricingOk, base), [
          { nombre: "En curso", valor: n.pricingCurso, base: n.pricing, tono: "curso" },
          { nombre: "Rechazado", valor: n.pricingRecha, base: n.pricing, tono: "recha" },
          { nombre: "Sin tarea", valor: n.pricingSin, base: n.checksOk, tono: "" },
        ])}
        ${pasoEmbudo("Remo y pricing", n.finalizo, pctTxt(n.finalizo, n.llego) + " de los que llegaron", anchoEmbudo(n.finalizo, base), [])}
        ${pasoEmbudo("Hesh", n.heshOk, siguen(n.heshOk, n.hesh), anchoEmbudo(n.heshOk, base), [
          { nombre: "En curso", valor: n.heshCurso, base: n.hesh, tono: "curso" },
          { nombre: "Sin tarea", valor: n.heshNo, base: n.docOk, tono: "" },
        ])}
        ${pasoEmbudo("Armado de precio", n.armadoOk, siguen(n.armadoOk, n.armado), anchoEmbudo(n.armadoOk, base), [
          { nombre: "En curso", valor: n.armadoCurso, base: n.armado, tono: "curso" },
          { nombre: "Rechazado", valor: n.armadoRecha, base: n.armado, tono: "recha" },
          { nombre: "Sin inicial", valor: n.armadoSin, base: n.heshOk, tono: "" },
        ])}
        ${pasoEmbudo("Aprobología", n.aprobOk, siguen(n.aprobOk, n.aprob), anchoEmbudo(n.aprobOk, base), [
          { nombre: "En curso", valor: n.aprobCurso, base: n.heshOk, tono: "curso" },
          { nombre: "Rechazado", valor: n.aprobRecha, base: n.heshOk, tono: "recha" },
          { nombre: "Sin tarea", valor: n.aprobSin, base: n.heshOk, tono: "" },
        ])}
      </div>
    </div>
    <p class="embudo-nota">La barra verde es quien sigue, y se angosta porque cada etapa deja gente atrás. La pastilla dice cuántos se quedaron ahí: en curso, rechazado o sin tarea.</p>`;
}
let relojFunnel = 0;
let intentosFunnel = 0;
function vigilarFunnel() {
  if (window.TABLAS && window.TABLAS.funnel) return;
  clearInterval(relojFunnel);
  llamarServidor("prepararFunnel").then(prog => {
    if (prog && prog.error) {
      window.ERROR_FUNNEL = prog.error;
      if (vistaId === "funnel") pintarFunnel();
    }
  }).catch(() => {});
  relojFunnel = setInterval(async () => {
    try {
      const boot = await llamarServidor("getBootstrap");
      if (!boot || !boot.funnel) {
        if (boot && !boot.corriendo && intentosFunnel < 3) {
          intentosFunnel++;
          llamarServidor("prepararFunnel").catch(() => {});
        }
        return;
      }
      clearInterval(relojFunnel);
      await traerFunnel();
      if (!(window.TABLAS && window.TABLAS.funnel)) return;
      instalarCatalogo("funnel", catalogoDe("funnel"));
      if (vistaId === "funnel") pintarFunnel();
    } catch (e) {}
  }, 15000);
}
</script>
