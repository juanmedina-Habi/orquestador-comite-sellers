<script>
/* Funnel de envíos a comité. Las condiciones salen de las hojas de Tableau; aquí solo se cuentan. */
function uno(c, i, k) {
  return c[k] && c[k][i] === "1";
}
function filasFunnel() {
  const t = window.TABLAS && window.TABLAS.funnel;
  if (!t) return null;
  const f = filtros();
  const nid = (val("funnel-nid") || "").trim();
  const c = t.cols;
  const idx = [];
  for (let i = 0; i < t.n; i++) {
    if (f.pais && c.pais[i] !== f.pais) continue;
    if (!enRango(c.envio[i], f.envioDesde, f.envioHasta)) continue;
    if (f.equipo && !f.equipo.has(c.equipo[i])) continue;
    if (f.propietario && !f.propietario.has(c.propietario[i])) continue;
    if (f.dueno && !f.dueno.has(c.dueno[i])) continue;
    if (nid && String(c.nid[i]).indexOf(nid) < 0) continue;
    idx.push(i);
  }
  return { t: t, idx: idx };
}
function contarFunnel(t, idx) {
  const c = t.cols;
  const n = {
    llego: 0,
    doc: 0, docOk: 0, docCurso: 0, docRecha: 0, docNo: 0,
    checks: 0, checksOk: 0, checksCurso: 0, checksNo: 0,
    pricing: 0, pricingOk: 0, pricingCurso: 0, pricingRecha: 0, pricingSin: 0,
    remo: 0, remoOk: 0, remoCurso: 0, remoRecha: 0, finalizo: 0,
    hesh: 0, heshOk: 0, heshCurso: 0, heshNo: 0,
    armado: 0, armadoOk: 0, armadoCurso: 0, armadoRecha: 0, armadoSin: 0,
    aprob: 0, aprobOk: 0, aprobCurso: 0, aprobRecha: 0, aprobSin: 0,
  };
  idx.forEach(i => {
    const orq = uno(c, i, "orq");
    const revDoc = uno(c, i, "rev_doc");
    const docOk = uno(c, i, "doc_ok");
    const revChecks = uno(c, i, "rev_checks");
    const checksOk = uno(c, i, "checks_ok");
    const revPricing = uno(c, i, "rev_pricing");
    const pricingOk = uno(c, i, "pricing_ok");
    const revRemo = uno(c, i, "rev_remo");
    const remoOk = uno(c, i, "remo_ok");
    const revHesh = uno(c, i, "rev_hesh");
    const heshOk = uno(c, i, "hesh_ok");
    const revArmado = uno(c, i, "rev_armado");
    const revAprob = uno(c, i, "rev_aprob");
    if (orq) n.llego++;
    if (revDoc) n.doc++;
    if (revDoc && docOk) n.docOk++;
    if (revDoc && uno(c, i, "doc_curso")) n.docCurso++;
    if (revDoc && uno(c, i, "doc_recha")) n.docRecha++;
    if (!revDoc && orq) n.docNo++;
    if (revDoc && revChecks && docOk) n.checks++;
    if (revDoc && revChecks && docOk && checksOk) n.checksOk++;
    if (revDoc && revChecks && docOk && uno(c, i, "checks_curso")) n.checksCurso++;
    if (revDoc && !revChecks && docOk) n.checksNo++;
    if (revDoc && revPricing && docOk) n.pricing++;
    if (revDoc && revPricing && docOk && pricingOk) n.pricingOk++;
    if (revDoc && revPricing && docOk && !pricingOk && uno(c, i, "pricing_curso")) n.pricingCurso++;
    if (revDoc && revPricing && docOk && uno(c, i, "pricing_recha")) n.pricingRecha++;
    if (revDoc && !revPricing && checksOk && docOk) n.pricingSin++;
    if (revDoc && revRemo && docOk) n.remo++;
    if (revDoc && revRemo && docOk && remoOk) n.remoOk++;
    if (revDoc && revRemo && docOk && uno(c, i, "remo_curso")) n.remoCurso++;
    if (revDoc && revRemo && docOk && uno(c, i, "remo_recha")) n.remoRecha++;
    if (revDoc && docOk && pricingOk && remoOk) n.finalizo++;
    if (revDoc && revHesh && docOk) n.hesh++;
    if (revDoc && docOk && heshOk) n.heshOk++;
    if (revDoc && revHesh && docOk && uno(c, i, "hesh_curso")) n.heshCurso++;
    if (revDoc && !revHesh && docOk && pricingOk && remoOk) n.heshNo++;
    const puertaArmado = docOk && heshOk && pricingOk && remoOk && (c.envio[i] || "") > "2025-10-26";
    if (puertaArmado && revArmado) n.armado++;
    if (puertaArmado && revArmado && uno(c, i, "armado_ok")) n.armadoOk++;
    if (puertaArmado && revArmado && uno(c, i, "armado_curso")) n.armadoCurso++;
    if (puertaArmado && revArmado && uno(c, i, "armado_recha")) n.armadoRecha++;
    if (puertaArmado && !revArmado) n.armadoSin++;
    if (revAprob && docOk && heshOk) n.aprob++;
    if (docOk && heshOk && uno(c, i, "aprob_ok")) n.aprobOk++;
    if (docOk && heshOk && uno(c, i, "aprob_curso")) n.aprobCurso++;
    if (docOk && heshOk && uno(c, i, "aprob_recha")) n.aprobRecha++;
    if (!revAprob && docOk && heshOk) n.aprobSin++;
  });
  n.envios = idx.length;
  n.noLlego = n.envios - n.llego;
  return n;
}
function pctTxt(parte, base) {
  if (!base) return "—";
  return nf1.format((100 * parte) / base) + "%";
}
const ORIGEN_X = 320;
const ORIGEN_Y = 5900;
const ANCHO_FUNNEL = 99360;
const ALTO_FUNNEL = 70221;
function zona(x, y, w, h, nombre, valor, base, tono) {
  const hueco = 0.28;
  const izquierda = (x - ORIGEN_X) / ANCHO_FUNNEL * 100 + hueco;
  const arriba = (y - ORIGEN_Y) / ALTO_FUNNEL * 100 + hueco;
  const ancho = Math.max(w / ANCHO_FUNNEL * 100 - hueco * 2, 1.2);
  const alto = Math.max(h / ALTO_FUNNEL * 100 - hueco * 2, 1.2);
  const pct = tono === "total" ? "" : `<small>${pctTxt(valor, base)}</small>`;
  return `<article class="caja-pos ${tono}" style="left:${izquierda}%;top:${arriba}%;width:${ancho}%;height:${alto}%"><span>${esc(nombre)}</span><strong>${nf.format(valor)}</strong>${pct}</article>`;
}
function pintarFunnel() {
  const v = VISTAS.find(x => x.id === "funnel");
  document.getElementById("titulo").textContent = v.nombre;
  document.getElementById("subtitulo").textContent = v.nota;
  const detalle = document.getElementById("detalle");
  detalle.hidden = true;
  detalle.innerHTML = "";
  detalleArmada = "";
  const pagina = document.getElementById("pagina");
  const pack = filasFunnel();
  if (!pack) {
    const extra = window.ERROR_FUNNEL ? ` ${esc(window.ERROR_FUNNEL)}` : " Si acabas de publicar, vuelve a esta pestaña en un minuto.";
    pagina.innerHTML = `<p class="aviso-espera">El funnel se está preparando con la lectura del día. Las pestañas de SLA siguen disponibles.${extra}</p>`;
    return;
  }
  const n = contarFunnel(pack.t, pack.idx);
  const pais = radio("funnel-pais");
  const donde = pais ? rotuloPais(pais) : "Todos los países";
  const cajas = [
    zona(320, 5900, 99360, 3614, "Cantidad de envíos a comité", n.envios, n.envios, "total"),
    zona(320, 9514, 5240, 4910, "No recibido por orquestador", n.noLlego, n.envios, "muted"),
    zona(5560, 9514, 94120, 4910, "Recibidos por el orquestador", n.llego, n.envios, "sigue"),
    zona(5560, 14424, 4760, 4265, "Sin tarea rev. documentos", n.docNo, n.llego, "muted"),
    zona(10320, 14424, 89360, 4265, "Revisión de documentos", n.doc, n.llego, "etapa"),
    zona(10320, 18689, 5800, 3270, "Rechazado", n.docRecha, n.doc, "recha"),
    zona(16120, 18689, 4440, 3269, "En proceso", n.docCurso, n.doc, "curso"),
    zona(20560, 18689, 79120, 3284, "Aprobado", n.docOk, n.doc, "ok"),
    zona(20560, 21973, 12520, 3587, "Revisión de remodelación", n.remo, n.docOk, "etapa"),
    zona(33080, 21973, 60226, 3603, "Checks automáticos", n.checks, n.docOk, "etapa"),
    zona(93306, 21973, 6374, 3603, "Sin tarea checks", n.checksNo, n.docOk, "muted"),
    zona(20560, 25560, 3880, 12379, "Rechazado", n.remoRecha, n.remo, "recha"),
    zona(24440, 25560, 4760, 12379, "En proceso", n.remoCurso, n.remo, "curso"),
    zona(29200, 25560, 3880, 12379, "Aprobado", n.remoOk, n.remo, "ok"),
    zona(33080, 25576, 54385, 5149, "Aprobado", n.checksOk, n.checks, "ok"),
    zona(87465, 25576, 5841, 5149, "En proceso", n.checksCurso, n.checks, "curso"),
    zona(33080, 30725, 47719, 3759, "Pricing", n.pricing, n.checksOk, "etapa"),
    zona(80799, 30725, 6666, 3759, "Sin tarea pricing", n.pricingSin, n.checksOk, "muted"),
    zona(33080, 34484, 38920, 3455, "Aprobado", n.pricingOk, n.pricing, "ok"),
    zona(72000, 34484, 3880, 3455, "En proceso", n.pricingCurso, n.pricing, "curso"),
    zona(75880, 34484, 4928, 3455, "Rechazado", n.pricingRecha, n.pricing, "recha"),
    zona(29303, 37939, 42697, 4243, "Aprobado remodelación y pricing", n.finalizo, n.docOk, "ok"),
    zona(29303, 42182, 6777, 4363, "Sin tarea hesh", n.heshNo, n.finalizo, "muted"),
    zona(36080, 42182, 35920, 4363, "Hesh", n.hesh, n.finalizo, "etapa"),
    zona(35978, 46545, 4640, 4303, "En proceso", n.heshCurso, n.hesh, "curso"),
    zona(40618, 46545, 31382, 4303, "Aprobado", n.heshOk, n.hesh, "ok"),
    zona(40618, 50848, 27248, 3940, "Armado de precio", n.armado, n.heshOk, "etapa"),
    zona(67866, 50848, 4134, 3940, "Sin inicial", n.armadoSin, n.heshOk, "muted"),
    zona(40618, 54788, 21422, 5030, "Aprobado", n.armadoOk, n.armado, "ok"),
    zona(62040, 54788, 2520, 5030, "En curso", n.armadoCurso, n.armado, "curso"),
    zona(64560, 54788, 3320, 5030, "Rechazado", n.armadoRecha, n.armado, "recha"),
    zona(40618, 59818, 15771, 7273, "Aprobología", n.aprob, n.heshOk, "etapa"),
    zona(56389, 59818, 5657, 7273, "Sin tarea aprobología", n.aprobSin, n.heshOk, "muted"),
    zona(40618, 67091, 3811, 9030, "Rechazado", n.aprobRecha, n.heshOk, "recha"),
    zona(44429, 67091, 6181, 9030, "En proceso", n.aprobCurso, n.heshOk, "curso"),
    zona(50610, 67091, 5779, 9030, "Aprobado", n.aprobOk, n.heshOk, "ok"),
  ];
  pagina.innerHTML = `
    <div class="marco-embudo" aria-label="Funnel ${esc(donde)}">
      <div class="lienzo-embudo">${cajas.join("")}</div>
    </div>
    <p class="embudo-nota">Misma ubicación que el funnel de Tableau. El camino se corre a la derecha y a los lados quedan rechazado, en proceso y sin tarea. ${esc(donde)}.</p>`;
}
let relojFunnel = 0;
let intentosFunnel = 0;
function vigilarFunnel() {
  if (window.TABLAS && window.TABLAS.funnel) return;
  clearInterval(relojFunnel);
  llamarServidor("prepararFunnel").then(prog => {
    if (prog && prog.error) {
      window.ERROR_FUNNEL = prog.error;
      if (vistaId === "funnel") pintarFunnel();
    }
  }).catch(() => {});
  relojFunnel = setInterval(async () => {
    try {
      const boot = await llamarServidor("getBootstrap");
      if (!boot || !boot.funnel) {
        if (boot && !boot.corriendo && intentosFunnel < 3) {
          intentosFunnel++;
          llamarServidor("prepararFunnel").catch(() => {});
        }
        return;
      }
      clearInterval(relojFunnel);
      await traerFunnel();
      if (!(window.TABLAS && window.TABLAS.funnel)) return;
      instalarCatalogo("funnel", catalogoDe("funnel"));
      if (vistaId === "funnel") pintarFunnel();
    } catch (e) {}
  }, 15000);
}
</script>
