<script>
/* Funnel de envíos a comité. Las condiciones salen de las hojas de Tableau; aquí solo se cuentan. */
function uno(c, i, k) {
  return c[k] && c[k][i] === "1";
}
function filasFunnel() {
  const t = window.TABLAS && window.TABLAS.funnel;
  if (!t) return null;
  const f = filtros();
  const nid = (val("funnel-nid") || "").trim();
  const c = t.cols;
  const idx = [];
  for (let i = 0; i < t.n; i++) {
    if (f.pais && c.pais[i] !== f.pais) continue;
    if (!enRango(c.envio[i], f.envioDesde, f.envioHasta)) continue;
    if (f.equipo && !f.equipo.has(c.equipo[i])) continue;
    if (f.propietario && !f.propietario.has(c.propietario[i])) continue;
    if (f.dueno && !f.dueno.has(c.dueno[i])) continue;
    if (nid && String(c.nid[i]).indexOf(nid) < 0) continue;
    idx.push(i);
  }
  return { t: t, idx: idx };
}
function contarFunnel(t, idx) {
  const c = t.cols;
  const n = {
    llego: 0,
    doc: 0, docOk: 0, docCurso: 0, docRecha: 0, docNo: 0,
    checks: 0, checksOk: 0, checksCurso: 0, checksNo: 0,
    pricing: 0, pricingOk: 0, pricingCurso: 0, pricingRecha: 0, pricingSin: 0,
    remo: 0, remoOk: 0, remoCurso: 0, remoRecha: 0, finalizo: 0,
    hesh: 0, heshOk: 0, heshCurso: 0, heshNo: 0,
    armado: 0, armadoOk: 0, armadoCurso: 0, armadoRecha: 0, armadoSin: 0,
    aprob: 0, aprobOk: 0, aprobCurso: 0, aprobRecha: 0, aprobSin: 0,
  };
  idx.forEach(i => {
    const orq = uno(c, i, "orq");
    const revDoc = uno(c, i, "rev_doc");
    const docOk = uno(c, i, "doc_ok");
    const revChecks = uno(c, i, "rev_checks");
    const checksOk = uno(c, i, "checks_ok");
    const revPricing = uno(c, i, "rev_pricing");
    const pricingOk = uno(c, i, "pricing_ok");
    const revRemo = uno(c, i, "rev_remo");
    const remoOk = uno(c, i, "remo_ok");
    const revHesh = uno(c, i, "rev_hesh");
    const heshOk = uno(c, i, "hesh_ok");
    const revArmado = uno(c, i, "rev_armado");
    const revAprob = uno(c, i, "rev_aprob");
    if (orq) n.llego++;
    if (revDoc) n.doc++;
    if (revDoc && docOk) n.docOk++;
    if (revDoc && uno(c, i, "doc_curso")) n.docCurso++;
    if (revDoc && uno(c, i, "doc_recha")) n.docRecha++;
    if (!revDoc && orq) n.docNo++;
    if (revDoc && revChecks && docOk) n.checks++;
    if (revDoc && revChecks && docOk && checksOk) n.checksOk++;
    if (revDoc && revChecks && docOk && uno(c, i, "checks_curso")) n.checksCurso++;
    if (revDoc && !revChecks && docOk) n.checksNo++;
    if (revDoc && revPricing && docOk) n.pricing++;
    if (revDoc && revPricing && docOk && pricingOk) n.pricingOk++;
    if (revDoc && revPricing && docOk && !pricingOk && uno(c, i, "pricing_curso")) n.pricingCurso++;
    if (revDoc && revPricing && docOk && uno(c, i, "pricing_recha")) n.pricingRecha++;
    if (revDoc && !revPricing && checksOk && docOk) n.pricingSin++;
    if (revDoc && revRemo && docOk) n.remo++;
    if (revDoc && revRemo && docOk && remoOk) n.remoOk++;
    if (revDoc && revRemo && docOk && uno(c, i, "remo_curso")) n.remoCurso++;
    if (revDoc && revRemo && docOk && uno(c, i, "remo_recha")) n.remoRecha++;
    if (revDoc && docOk && pricingOk && remoOk) n.finalizo++;
    if (revDoc && revHesh && docOk) n.hesh++;
    if (revDoc && docOk && heshOk) n.heshOk++;
    if (revDoc && revHesh && docOk && uno(c, i, "hesh_curso")) n.heshCurso++;
    if (revDoc && !revHesh && docOk && pricingOk && remoOk) n.heshNo++;
    const puertaArmado = docOk && heshOk && pricingOk && remoOk && (c.envio[i] || "") > "2025-10-26";
    if (puertaArmado && revArmado) n.armado++;
    if (puertaArmado && revArmado && uno(c, i, "armado_ok")) n.armadoOk++;
    if (puertaArmado && revArmado && uno(c, i, "armado_curso")) n.armadoCurso++;
    if (puertaArmado && revArmado && uno(c, i, "armado_recha")) n.armadoRecha++;
    if (puertaArmado && !revArmado) n.armadoSin++;
    if (revAprob && docOk && heshOk) n.aprob++;
    if (docOk && heshOk && uno(c, i, "aprob_ok")) n.aprobOk++;
    if (docOk && heshOk && uno(c, i, "aprob_curso")) n.aprobCurso++;
    if (docOk && heshOk && uno(c, i, "aprob_recha")) n.aprobRecha++;
    if (!revAprob && docOk && heshOk) n.aprobSin++;
  });
  n.envios = idx.length;
  n.noLlego = n.envios - n.llego;
  return n;
}
function pctTxt(parte, base) {
  if (!base) return "—";
  return nf1.format((100 * parte) / base) + "%";
}
const ORIGEN_X = 320;
const ORIGEN_Y = 5900;
const ANCHO_FUNNEL = 99360;
const ALTO_FUNNEL = 70221;
function zona(x, y, w, h, nombre, valor, base, tono) {
  const hueco = 0.22;
  const izquierda = (x - ORIGEN_X) / ANCHO_FUNNEL * 100 + hueco;
  const arriba = (y - ORIGEN_Y) / ALTO_FUNNEL * 100 + hueco;
  const ancho = Math.max(w / ANCHO_FUNNEL * 100 - hueco * 2, 1.1);
  const alto = Math.max(h / ALTO_FUNNEL * 100 - hueco * 2, 1.1);
  const porcentaje = tono === "total" ? "" : pctTxt(valor, base);
  const pct = porcentaje ? `<small>${porcentaje}</small>` : "";
  const alBorde = x + w > 82000 ? " tip-izq" : "";
  const texto = porcentaje ? `${nombre}: ${nf.format(valor)} (${porcentaje})` : `${nombre}: ${nf.format(valor)}`;
  return `<article class="caja-pos ${tono}${alBorde}" style="left:${izquierda}%;top:${arriba}%;width:${ancho}%;height:${alto}%" title="${esc(texto)}">
    <div class="caja-vista"><span>${esc(nombre)}</span><strong>${nf.format(valor)}</strong>${pct}</div>
    <div class="caja-tip"><span>${esc(nombre)}</span><strong>${nf.format(valor)}</strong>${pct}</div>
  </article>`;
}

  pagina.innerHTML = `

  else {

    const sinLista = equipo && !equipo.querySelector("input[data-valor]");

function instalarDetalle() {
  const t = window.TABLAS && window.TABLAS.funnel;
  if (!t || !t.cols || !document.getElementById("det-estado")) return;
  const distintos = col => {
    const set = new Set();
    (t.cols[col] || []).forEach(v => { if (v) set.add(v); });
    return [...set].sort((a, b) => a.localeCompare(b, "es"));
  };
  const llenarSelect = (id, valores) => {
    const el = document.getElementById(id);
    const actual = el.value;
    el.innerHTML = `<option value="">(Todo)</option>` + valores.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
    el.value = valores.indexOf(actual) >= 0 ? actual : "";
  };
  if (t.cols.estado) llenarSelect("det-estado", distintos("estado"));
  if (t.cols.etapa) llenarSelect("det-etapa", distintos("etapa"));
  ["equipo", "propietario", "dueno"].forEach(dim => {
    const id = "det-" + dim;
    const prev = marcasActuales(id);
    llenarLista(id, distintos(dim));
    if (prev) marcarLista(id, prev);
  });
}

}
function moverPaginaFunnel(delta) {
  busqueda.funnel.pagina = Math.max(0, (busqueda.funnel.pagina || 0) + delta);
  pintarTablaFunnel();
}
function pintarTablaFunnel() {
  const cuerpo = document.getElementById("fun-cuerpo");

  const pack = filasDetalle();
  if (!pack) {
    cuerpo.innerHTML = `<tr><td colspan="13">Todavía no llega el listado de envíos. El embudo de arriba sigue disponible.</td></tr>`;
    if (cuenta) cuenta.textContent = "";
    return;
  }
  const c = pack.t.cols;
  const celda = (nombre, i) => (c[nombre] ? (c[nombre][i] || "") : "");
  const orden = pack.idx.slice().sort((a, b) => {
    if (c.envio[a] !== c.envio[b]) return c.envio[a] < c.envio[b] ? 1 : -1;
    if (c.nid[a] !== c.nid[b]) return c.nid[a] < c.nid[b] ? 1 : -1;
    return 0;
  });
  const total = orden.length;
  const ultima = Math.max(0, Math.ceil(total / TAM) - 1);
  if ((busqueda.funnel.pagina || 0) > ultima) busqueda.funnel.pagina = ultima;
  const pagina = busqueda.funnel.pagina || 0;
  const corte = orden.slice(pagina * TAM, pagina * TAM + TAM);
  cuerpo.innerHTML = corte.map(i => `<tr>
    <td>${esc(rotuloPais(c.pais[i]))}</td>
    <td class="num">${esc(c.nid[i])}</td>
    <td class="num">${esc(fechaHora(celda("envio", i), celda("hora_envio", i)))}</td>
    <td>${esc(celda("estado", i))}</td>
    <td>${esc(textoSiNo(c.entro ? celda("entro", i) : (c.orq[i] === "1" ? "Si" : "No")))}</td>
    <td>${esc(textoSiNo(celda("inc_doc", i)))}</td>
    <td class="num">${esc(fechaHora(celda("fecha_doc", i), celda("hora_doc", i)))}</td>
    <td class="num">${esc(fechaHora(celda("fecha_remo", i), celda("hora_remo", i)))}</td>
    <td class="num">${esc(fechaHora(celda("fecha_checks", i), celda("hora_checks", i)))}</td>
    <td class="num">${esc(fechaHora(celda("fecha_pricing", i), celda("hora_pricing", i)))}</td>
    <td class="num">${esc(fechaHora(celda("fecha_hesh", i), celda("hora_hesh", i)))}</td>
    <td class="num">${esc(fechaHora(celda("fecha_aprob", i), celda("hora_aprob", i)))}</td>
    <td class="num">${esc(fechaHora(celda("fin", i), celda("hora_fin", i)))}</td>
  </tr>`).join("") || `<tr><td colspan="13">No hay nid con estos filtros.</td></tr>`;
  if (cuenta) cuenta.textContent = total ? `${nf.format(pagina * TAM + 1)}–${nf.format(Math.min(total, (pagina + 1) * TAM))} de ${nf.format(total)}` : "0 nid";
  const prev = document.getElementById("fun-prev");
  const next = document.getElementById("fun-next");
  if (prev) prev.disabled = pagina <= 0;
  if (next) next.disabled = pagina >= ultima;
}
function textoSiNo(v) {
  return v === "Si" ? "Sí" : v === "No" ? "No" : "";
}
function filasDetalle() {
  const t = window.TABLAS && window.TABLAS.funnel;
  if (!t || !t.cols || !t.n) return null;
  const c = t.cols;
  const desde = val("det-envio-desde");
  const hasta = val("det-envio-hasta");
  const entro = val("det-entro");
  const estado = val("det-estado");
  const etapa = val("det-etapa");
  const nid = (val("det-nid") || "").trim();
  const equipo = marcas("det-equipo");
  const propietario = marcas("det-propietario");
  const dueno = marcas("det-dueno");
  const inc = {
    inc_doc: val("det-inc-doc"),
    inc_checks: val("det-inc-checks"),
    inc_pricing: val("det-inc-pricing"),
    inc_hesh: val("det-inc-hesh"),
    inc_aprob: val("det-inc-aprob"),
  };
  const idx = [];
  for (let i = 0; i < t.n; i++) {
    if (!enRango(c.envio[i], desde, hasta)) continue;
    if (entro) {
      const marca = c.entro ? c.entro[i] : (c.orq[i] === "1" ? "Si" : "No");
      if (marca !== entro) continue;
    }
    if (estado && c.estado && c.estado[i] !== estado) continue;
    if (etapa && c.etapa && c.etapa[i] !== etapa) continue;
    if (nid && String(c.nid[i]).indexOf(nid) < 0) continue;
    if (equipo && !equipo.has(c.equipo[i])) continue;
    if (propietario && !propietario.has(c.propietario[i])) continue;
    if (dueno && !dueno.has(c.dueno[i])) continue;
    let sigue = true;
    Object.keys(inc).forEach(k => {
      if (inc[k] && c[k] && c[k][i] !== inc[k]) sigue = false;
    });
    if (!sigue) continue;
    idx.push(i);
  }
  return { t: t, idx: idx };
}
const GRUPOS_ENVIO = [
  { id: "llego", nombre: "Llegó al orquestador" },
  { id: "curso", nombre: "Comité en curso" },
  { id: "revision", nombre: "En revisión" },
];
function grupoEnvio(c, i) {
  if (c.orq[i] === "1") return "llego";
  if (!(c.comite_curso && c.envio_pasado)) return "";
  if (c.comite_curso[i] === "1" || c.envio_pasado[i] === "1") return "curso";
  return "revision";
}
function pintarDesglose() {
  const root = document.getElementById("desglose");
  if (!root) return;
  const pack = filasFunnel();
  if (!pack) {
    root.hidden = true;
    return;
  }
  root.hidden = false;
  if (!root.dataset.escucha) {
    root.dataset.escucha = "1";
    root.addEventListener("click", e => {
      const barra = e.target.closest("[data-grupo]");
      if (barra && !barra.disabled) {
        const id = barra.dataset.grupo;
        busqueda.funnel.grupo = busqueda.funnel.grupo === id ? "" : id;
        busqueda.funnel.paginaGrupo = 0;
        pintarDesglose();
        return;
      }
      if (e.target.id === "desg-prev") moverGrupo(-1);
      if (e.target.id === "desg-next") moverGrupo(1);
    });
  }
  const c = pack.t.cols;
  const clasificado = !!(c.comite_curso && c.envio_pasado);
  const conteo = { llego: 0, curso: 0, revision: 0 };
  let fuera = 0;
  pack.idx.forEach(i => {
    const g = grupoEnvio(c, i);
    if (g) conteo[g]++;
    else fuera++;
  });
  const total = pack.idx.length;
  const mayor = Math.max(conteo.llego, conteo.curso, conteo.revision, 1);
  const elegido = busqueda.funnel.grupo || "";
  const barras = GRUPOS_ENVIO.map(g => {
    const n = conteo[g.id];
    const listo = g.id === "llego" || clasificado;
    const ancho = listo ? Math.max(2, Math.round(100 * n / mayor)) : 0;
    const activo = elegido === g.id ? " activa" : "";
    return `<button type="button" class="barra-desglose ${g.id}${activo}" data-grupo="${g.id}"${listo ? "" : " disabled"}>
      <b>${esc(g.nombre)}</b>
      <span class="barra-pista"><i style="width:${ancho}%"></i></span>
      <strong>${listo ? nf.format(n) : "…"}</strong>
      <small>${listo ? pctTxt(n, total) : ""}</small>
    </button>`;
  }).join("");
  const aviso = clasificado ? "" : `<p class="desglose-nota">Sin llegar al orquestador: ${nf.format(fuera)}. El corte entre comité en curso y en revisión se completa en un momento.</p>`;
  let lista = "";
  if (elegido && (elegido === "llego" || clasificado)) {
    const nombre = (GRUPOS_ENVIO.find(g => g.id === elegido) || {}).nombre || "";
    const filas = pack.idx.filter(i => grupoEnvio(c, i) === elegido).sort((a, b) => {
      if (c.envio[a] !== c.envio[b]) return c.envio[a] < c.envio[b] ? 1 : -1;
      if (c.nid[a] !== c.nid[b]) return c.nid[a] < c.nid[b] ? 1 : -1;
      return 0;
    });
    const paso = 15;
    const ultima = Math.max(0, Math.ceil(filas.length / paso) - 1);
    let pagina = busqueda.funnel.paginaGrupo || 0;
    if (pagina > ultima) pagina = ultima;
    busqueda.funnel.paginaGrupo = pagina;
    const corte = filas.slice(pagina * paso, pagina * paso + paso);
    const cuenta = filas.length ? `${nf.format(pagina * paso + 1)}–${nf.format(Math.min(filas.length, (pagina + 1) * paso))} de ${nf.format(filas.length)}` : "0 nid";
    lista = `<div class="desglose-lista">
      <div class="detalle-bar"><span>${esc(nombre)}. ${cuenta}. Vuelve a pulsar la barra para cerrar la lista.</span>
        <span class="detalle-nav">
          <button type="button" class="btn-limpiar" id="desg-prev"${pagina <= 0 ? " disabled" : ""}>Anterior</button>
          <button type="button" class="btn-limpiar" id="desg-next"${pagina >= ultima ? " disabled" : ""}>Siguiente</button>
        </span>
      </div>
      <div class="detalle-marco">
        <table>
          <thead><tr><th>Fecha de envío</th><th>Nid</th><th>País</th><th>Categoría</th></tr></thead>
          <tbody>${corte.map(i => `<tr>
            <td class="num">${esc(fechaCorta(c.envio[i]))}</td>
            <td class="num">${esc(c.nid[i])}</td>
            <td>${esc(rotuloPais(c.pais[i]))}</td>
            <td>${esc(nombre)}</td>
          </tr>`).join("") || `<tr><td colspan="4">No hay nid en este grupo.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
  }
  root.innerHTML = `
    <div class="detalle-cab">
      <div>
        <h2>Desglose de envíos</h2>
        <p>Los envíos de este embudo, con las tres categorías de Tableau. Sigue los filtros de arriba.</p>
      </div>
    </div>
    <div class="barras-desglose">${barras}</div>
    ${aviso}
    ${lista}`;
}
function moverGrupo(delta) {
  busqueda.funnel.paginaGrupo = Math.max(0, (busqueda.funnel.paginaGrupo || 0) + delta);
  pintarDesglose();
}
function fechaHora(iso, hora) {
  const f = fechaCorta(iso);
  if (!f) return "";
  return hora ? f + " " + hora : f;
}
function funnelActual() {
  const t = window.TABLAS && window.TABLAS.funnel;
  return !!(t && t.cols && t.cols.fecha_doc && t.cols.etapa && t.cols.estado && t.cols.entro && t.cols.hora_envio && t.cols.comite_curso && t.cols.envio_pasado);
}
let relojFunnel = 0;
let intentosFunnel = 0;
function vigilarFunnel() {
  if (funnelActual()) return;
  clearInterval(relojFunnel);
  llamarServidor("prepararFunnel").then(prog => {
    if (prog && prog.error) {
      window.ERROR_FUNNEL = prog.error;
      if (vistaId === "funnel") pintarFunnel();
    }
  }).catch(() => {});
  relojFunnel = setInterval(async () => {
    try {
      const boot = await llamarServidor("getBootstrap");
      if (!boot || !boot.funnel) {
        if (boot && !boot.corriendo && intentosFunnel < 3) {
          intentosFunnel++;
          llamarServidor("prepararFunnel").catch(() => {});
        }
        return;
      }
      clearInterval(relojFunnel);
      await traerFunnel();
      if (!(window.TABLAS && window.TABLAS.funnel)) return;
      instalarCatalogo("funnel", catalogoDe("funnel"));
      if (vistaId === "funnel") pintarFunnel();
    } catch (e) {}
  }, 15000);
}
</script>
